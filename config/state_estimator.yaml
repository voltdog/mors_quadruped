# HARDWARE
# Used to derive contacts only when contact_source is grf_observer.
contact_threshold: 1.0 #20.0 # - for Hs=0.13 #3.0 - for Hs=0.11
contact_source: "sensor" # sensor | grf_observer

# Источник данных для канала ROBOT_STATE: kalman | t265.
#   kalman — позиция и линейная скорость из KalmanMIT (требует kalman_mit.enabled: true,
#            иначе процесс падает при старте)
#   t265   — одометрия T265
# Канал ROBOT_STATE_CHECK всегда получает ПРОТИВОПОЛОЖНЫЙ источник, отдельного
# ключа для него нет: два канала — это две оценки, которые сравниваются в одном логе.
#
# Каждый канал формируется своим источником целиком: и поза с линейной скоростью
# корпуса, и всё состояние ног (legs.*_pos/_vel считаются от позы этого источника).
# Ориентация и угловая скорость в обоих каналах берутся из ИМУ и потому совпадают.
# Пока источник невалиден (например, KalmanMIT до первого контакта), его канал не
# публикуется вовсе — молчаливой подмены источника не происходит.
robot_state_source: "kalman" # "kalman" "t265"         # -> канал ROBOT_STATE

camera_offset_x: 0.26045
camera_offset_y: 0.01675
camera_offset_z: -0.01 

# Фильтр Калмана в стиле MIT Cheetah. В какой канал он попадёт, решает
# robot_state_source выше. Использует только ИМУ и кинематику ног, T265 в него не
# входит, поэтому его оценку можно честно сравнивать с одометрией в одном логе. Дрейф x/y при этом
# ожидаем: абсолютного датчика положения у фильтра нет.
# Все ключи необязательные; значения ниже совпадают с умолчаниями в коде.
kalman_mit:
  enabled: true

  # Шум процесса. Это ДИСПЕРСИИ, а не СКО (соглашение MIT).
  imu_process_noise_position: 0.02
  imu_process_noise_velocity: 0.02
  foot_process_noise_position: 0.002

  # Смещение акселерометра как состояние фильтра. Наблюдаемо, пока хотя бы одна
  # нога доверенная; на разгруженных ногах замирает на последнем значении и
  # продолжает компенсировать, поэтому Z не уходит вниз, когда робот ложится.
  # false возвращает прежний 18-мерный фильтр такт-в-такт.
  estimate_accel_bias: true
  accel_bias_process_noise: 1.0e-6   # дисперсия случайного блуждания, (м/с^2)^2/с
  initial_accel_bias_covariance: 0.25
  max_accel_bias: 1.0                # насыщение оценки смещения, м/с^2

  # Шум измерений (тоже дисперсии).
  foot_sensor_noise_position: 0.001
  foot_sensor_noise_velocity: 0.1
  foot_height_sensor_noise: 0.001

  # Раздувание Q и R недоверенной ноги: (1 + (1 - trust) * high_suspect_number).
  high_suspect_number: 100.0
  # MIT раздувает только блоки скорости и высоты стопы. true дополнительно
  # раздувает блок относительного положения и делает маховую стопу
  # ненаблюдаемой — включать только для эксперимента.
  scale_position_measurement_noise: false

  # Привязка к грунту. Именно это измерение убирает дрейф Z: без него на
  # логах дрейф вырастает с 0.00 до +0.92 мм/с.
  use_foot_height_measurement: true
  # Высота грунта при estimate_terrain_height: false, начальное значение высот
  # опор и уровень, от которого корпус отсчитывается при инициализации.
  ground_height: 0.0

  # Высота опоры под каждой ногой как состояние фильтра (4 состояния g_i).
  #
  # Зачем. Прежде строка высоты стопы говорила «стопа на плоскости
  # ground_height». На ступеньке четыре такие строки противоречат друг другу, и
  # примирить их может только высота корпуса: фильтр сажал её на СРЕДНЮЮ высоту
  # опор. По логу log_260910_135248 (платформа 50 мм) это -28 мм ошибки, когда
  # на платформе половина ног, и -49 мм, когда все четыре. Теперь строка
  # измеряет высоту стопы НАД СВОЕЙ опорой, и ошибка на том же логе -1 мм
  # (при terrain_relaxation_time_sec: 0) или -8 мм (при 10 с).
  #
  # Чем платим. Если высота опоры под каждой ногой свободна, у вертикали
  # появляется калибровочная свобода: одновременный сдвиг корпуса, стоп и всех
  # g_i не меняет ни одного измерения, а ИМУ и кинематика такой сдвиг не видят.
  # Он копится. Ограничивает его terrain_relaxation_time_sec — и он же ограничивает,
  # как долго держится ступенька. Настоящее снятие размена — карта высот
  # (KalmanMITInput::terrain_height), она пока не подключена.
  #
  # false возвращает прежний 21-мерный фильтр такт-в-такт.
  estimate_terrain_height: true

  # Постоянная времени возврата g_i к ground_height, с. 0 отключает возврат.
  # Без возврата на логе log_260910_134406 (120 с непрерывной рыси) оценка
  # уезжала на +0.6 м. 10 с выбраны по логам ~/mors_logs/log_26090*: на них
  # разброс z относительно T265 совпадает с прежним фильтром, а от ступеньки
  # удерживается 84 %. Больше tau — точнее ступенька, сильнее увод.
  terrain_relaxation_time_sec: 10.0

  # Шум процесса высоты опоры, дисперсии. Под стоящей ногой опора заморожена —
  # именно это делает её якорем высоты. На переносе она неизвестна, и раздутый
  # Q позволяет ей сесть на новый уровень при постановке.
  terrain_process_noise: 1.0e-8        # м^2/с, нога в опоре
  terrain_swing_process_noise: 1.0     # м^2/с, нога в переносе
  # Контакт должен продержаться столько подряд, прежде чем опора под ногой
  # защёлкнется, с. Отсекает дребезг датчика на касании и ловит стопу уже под
  # нагрузкой. 0 — защёлкивание по первому фронту: на log_260928_142621 это
  # плато +58 мм на ровном полу против +31 мм при 0.06.
  terrain_touchdown_confirm_sec: 0.06
  initial_terrain_covariance: 1.0e-4   # м^2, на инициализации

  # Дисперсия измерения высоты опоры из карты высот, м^2 (СКО 5 см). Работает
  # только по ногам, для которых заполнен KalmanMITInput::terrain_height.
  terrain_map_noise: 2.5e-3

  # Инициализация и численная защита.
  initial_covariance: 100.0
  min_init_contacts: 1
  xy_covariance_reset_threshold: 1.0e-6
  xy_covariance_reset_factor: 0.1
  max_velocity: 6.0
  gravity: 9.81

  # Доверие к ноге. В стойке планировщик паркует phi на 0.992..0.996 при
  # phase = STANCE сериями до 4 с, из-за чего оконное доверие падает до ~0.03 и
  # фильтр уходит в счисление по ИМУ. Если phi не двигается дольше таймаута,
  # переходим на бинарный флаг контакта; пока phi идёт, поведение совпадает с MIT.
  frozen_phase_fallback: true
  frozen_phase_epsilon: 1.0e-6
  frozen_phase_timeout_sec: 0.2
  contact_trust_floor: 0.0

  # Псевдоизмерение неподвижности (ZUPT), когда не доверяем ни одной ноге.
  # Без него на логе log_260909_135813 лежащий робот уезжал на 1.08 м за 5.4 с:
  # измерения становятся самоссылочными, и фильтр интегрирует ИМУ вместе с
  # накопленной ошибкой смещения (0.07 м/с^2), хотя сырой ИМУ в том же окне даёт
  # 0.003 м/с^2. Если при этом |a| = g и |w| = 0, корпус физически лежит, и это
  # само по себе измерение v = 0 — оно же возвращает наблюдаемость
  # горизонтальному смещению акселерометра.
  zupt_enabled: true
  zupt_trust_threshold: 0.0      # "опоры нет" = доверие всех ног не выше порога
  zupt_accel_tolerance: 0.4      # м/с^2, | |a| - g |; на лежащем роботе p95 = 0.30
  zupt_omega_tolerance: 0.1      # рад/с; на лежащем роботе p95 = 0.009
  zupt_hold_sec: 0.1             # выдержка ворот, отсекает удары о грунт
  zupt_measurement_noise: 1.0e-4 # дисперсия (м/с)^2, то есть СКО 1 см/с
  zupt_hold_position: true       # дополнительно держать положение на якоре
  zupt_position_measurement_noise: 1.0e-4


# SIMULATION
# contact_threshold: 6.0 #20.0 # - for Hs=0.13 #3.0 - for Hs=0.11

