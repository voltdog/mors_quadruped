#   enabled: false   # в симуляции ROBOT_STATE — истина от MuJoCo
# При enabled: false источник обязан быть "t265", иначе отказ при старте;
# канал ROBOT_STATE_CHECK в этом случае не публикуется.
# robot_state_source: "t265"
